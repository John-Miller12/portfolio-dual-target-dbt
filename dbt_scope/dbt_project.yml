name: retail
version: "1.0.0"
config-version: 2
profile: retail

# Run from the repo root with DBT_PROJECT_DIR=dbt_scope DBT_PROFILES_DIR=dbt_scope
# (design 02, B2). Model folder configs are added in the turns that create them.
# persist_docs writes the YAML descriptions to the warehouse as table and
# column comments; without it they only reach dbt docs (design 02, E10). The
# semantic folder renders its own comments (design 03, S7).

models:
  retail:
    staging:
      +schema: staging
      +materialized: view
      +persist_docs: {relation: true, columns: true}
    marts:
      +schema: marts
      +materialized: table
      +persist_docs: {relation: true, columns: true}
    semantic:      # design 03, D2. Built on Snowflake and Databricks only (R8).
      +schema: semantic
      +enabled: "{{ target.type in ['snowflake', 'databricks'] }}"
      +materialized: "{{ 'semantic_view' if target.type == 'snowflake' else 'metric_view' }}"
      +copy_grants: true   # READER keeps SELECT across the replace (Snowflake)
      +post-hook: "{{ grant_reader() }}"   # and gets it on first build (02A section 6)

seeds:
  retail:
    +schema: raw          # next to the dlt tables (design 01, D4)
    +quote_columns: false # UPPER_SNAKE headers stay unquoted (design 01, D7)
    +persist_docs: {relation: true, columns: true}
