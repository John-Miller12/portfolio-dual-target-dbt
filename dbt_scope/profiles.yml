# Targets (design 02, B7; 02A section 5).
# Credentials always come from env_var(), never from this file. Secrets use
# the DBT_ENV_SECRET_ prefix so dbt scrubs them from logs.
# Your Snowflake sign-in is the browser (Snowflake OAuth for local
# applications, password + MFA); no secret is stored for your user (02A
# revision 7). ACCOUNTADMIN setup is a Snowsight script, not a target:
# admin/snowflake/provision_platform_admin.sql.
# Still to come: databricks_admin (phase 3), a key-pair CI target (phase 4).
# Object-name defaults below are placeholders until accounts are set up
# (design 03, D9 turns 3-4).

retail:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      # Relative to the repo root, where load/pipeline.py writes the raw tables.
      path: "{{ env_var('DBT_DUCKDB_PATH', '.local/dev.duckdb') }}"
      schema: main   # fallback only; every node sets a custom schema
      threads: 4

    snowflake:       # you, as TRANSFORMER (inherited through PLATFORM_ADMIN), browser sign-in
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      authenticator: oauth_authorization_code
      role: TRANSFORMER
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'RETAIL_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'RETAIL') }}"
      schema: main   # fallback only
      threads: 4

    snowflake_admin: # you, as PLATFORM_ADMIN, for bootstrap() (02A section 5)
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      authenticator: oauth_authorization_code
      role: PLATFORM_ADMIN
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'RETAIL_WH') }}"
      database: SNOWFLAKE    # always exists; bootstrap() creates the project database
      schema: INFORMATION_SCHEMA
      threads: 1

    databricks:      # transformers principal (02A section 6)
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_ENV_SECRET_DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
      schema: main   # fallback only
      threads: 4
